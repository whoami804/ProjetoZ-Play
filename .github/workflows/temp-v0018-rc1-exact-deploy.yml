name: Temporary v0.0.18 RC1 Exact Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-v0018-rc1-exact-deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public deploy repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact RC1 browser artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-a000-820e-b6f9-d069fe2cf0ee/raw?se=2026-09-15T00%3A05%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=aed50f76-333b-5716-a3d1-92eaea3e24dc&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A21%3A43Z&ske=2026-09-15T20%3A21%3A43Z&sks=b&skv=2026-02-06&sig=lhP3/%2Bhv3USiNeV2JzWt/bcmSHDwBxB6uMYPF9pH5J8%3D' -o /tmp/rc1.zip
          echo 'f62e5060d91dd7ad0a19df7792426e42afed1c46a2901c57cb36cbe01f7737b9  /tmp/rc1.zip' | sha256sum -c -

      - name: Verify exact build bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rc1-build
          mkdir -p /tmp/rc1-build
          unzip -q /tmp/rc1.zip -d /tmp/rc1-build
          echo '3015a7df3590dabe95380ef8d8cb1194192ebb7facbdd3d5cee3a9c32d067046  /tmp/rc1-build/index.html' | sha256sum -c -
          echo '43a526483e8c775a71091c299ac0d68d09a184b76fc1bc6593e6f8f4fb4eda91  /tmp/rc1-build/assets/index-CFTskYJv.js' | sha256sum -c -
          echo 'e0eafa8c37bc5132cf05e512b6e1af5a63c22e152b0299dd3ffa027e851f658f  /tmp/rc1-build/assets/index-tmoqlNsb.css' | sha256sum -c -

      - name: Replace only public game build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets
          cp -R /tmp/rc1-build/assets ./assets
          cp /tmp/rc1-build/index.html ./index.html

      - name: Commit exact RC1 deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'whoami804'
          git config user.email '75729332+whoami804@users.noreply.github.com'
          git add -A index.html assets
          git diff --cached --exit-code && { echo 'No build changes to deploy'; exit 1; } || true
          git commit -m 'deploy: v0.0.18 RC1 exact artifact'
          git push origin HEAD:main
