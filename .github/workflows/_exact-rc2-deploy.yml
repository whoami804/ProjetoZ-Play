name: Exact RC2 deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_exact-rc2-deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact RC2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_blob() {
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$1" --jq '.content' | tr -d '\n' | base64 -d
          }

          fetch_blob 72bc01949102b4d477becbae7c2cf20ea9dce76f > index.html
          mkdir -p assets
          rm -f assets/index-*.js

          : > /tmp/rc2.js.gz
          fetch_blob 8893cd1dccbc1c7eb67798cb1779cd032edfe7a2 >> /tmp/rc2.js.gz
          fetch_blob 574439bdc83a42f048c0b11ae5eaa0a8640134e7 >> /tmp/rc2.js.gz
          fetch_blob 62eac09b3c20aa11c2765198823a2bd7135e55ff >> /tmp/rc2.js.gz
          fetch_blob e0bcee0019ac1d7dfb026ed073b283380bb6aef1 >> /tmp/rc2.js.gz
          fetch_blob e371bde04901c4d2cd345651c709699e0d54a76f >> /tmp/rc2.js.gz
          fetch_blob 6bee9bff7519218e95b2c06d10f68d6cf03994a3 >> /tmp/rc2.js.gz

          echo '6a2a257a3e080c2f055cea67927ff8910c24f2b9e59974bcaca3077761c289ca  /tmp/rc2.js.gz' | sha256sum -c -
          gzip -dc /tmp/rc2.js.gz > assets/index-DKcS9QG1.js
          echo '45be3c095de0b1bb016bda5cfcd4ae2054f9f2103087eb6a3053025c289d032c  assets/index-DKcS9QG1.js' | sha256sum -c -
          echo '245642a327126144c4452a1662a8a14fd3ddaa505d42ad5c1734d025c19a2b2c  index.html' | sha256sum -c -
          echo 'e0eafa8c37bc5132cf05e512b6e1af5a63c22e152b0299dd3ffa027e851f658f  assets/index-tmoqlNsb.css' | sha256sum -c -

      - name: Commit exact RC2 artifact
        run: |
          set -euo pipefail
          git config user.name 'whoami804'
          git config user.email '75729332+whoami804@users.noreply.github.com'
          git add -A index.html assets
          git diff --cached --quiet && { echo 'No gameplay diff found'; exit 1; }
          git commit -m 'deploy: v0.0.19 RC2 exact artifact'
          git push origin HEAD:main
