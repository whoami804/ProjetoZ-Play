name: Temporary Ground Pilot Preview Import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-ground-preview.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify exact PR22 build artifact
        env:
          BUILD_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9b68-820e-b95c-f93c966214e4/raw?se=2026-11-03T06%3A15%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=b916e1d0-bdff-5b24-b37f-735be005e8ed&skoid=ba7c401a-35d6-40a0-a0f3-2259cc50bbe2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A35%3A48Z&ske=2026-11-04T00%3A35%3A48Z&sks=b&skv=2026-02-06&sig=Dy1QqxUKStlB2eaQKG5lECaGTPO8DlYw5efWIloT9aM%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$BUILD_URL" -o /tmp/ground.zip
          echo '9a54451188bb3e2a0a6fd160661eb918e3dad8a054e8d1c04eebe40251158ebb  /tmp/ground.zip' | sha256sum -c -
          test "$(unzip -Z1 /tmp/ground.zip | wc -l)" -eq 18
          unzip -Z1 /tmp/ground.zip | grep -Eq '^assets/ground-pilot-v01/06_transicao_SE.png$'
      - name: Prepare isolated preview branch
        run: |
          set -euo pipefail
          git switch -c preview/ground-pilot-pr22
          mkdir -p preview/v0.0.21.1-pr22
          unzip -q /tmp/ground.zip -d preview/v0.0.21.1-pr22
          test -f preview/v0.0.21.1-pr22/index.html
          test -f preview/v0.0.21.1-pr22/assets/index-f6Ywvgjr.js
          test -f preview/v0.0.21.1-pr22/assets/ground-pilot-v01/06_transicao_SE.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/v0.0.21.1-pr22
          git commit -m 'test(preview): stage v0.0.21.1 ground pilot PR22 artifact'
          git push origin HEAD:refs/heads/preview/ground-pilot-pr22
